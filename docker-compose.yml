services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vip-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - PORT=8000
      - DATABASE_PATH=video_intelligence.db
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_audio:/app/backend/temp_audio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vip-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  backend_uploads:
  backend_audio:
