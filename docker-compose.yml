version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vip-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - PORT=8000
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_audio:/app/backend/temp_audio
      - backend_chroma:/app/backend/chroma_db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vip-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
  backend_audio:
  backend_chroma:
